services:
  db:
    image: postgres:16
    container_name: veyora_db
    restart: always
    environment:
      POSTGRES_USER: veyora
      POSTGRES_PASSWORD: veyora_pass
      POSTGRES_DB: veyora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: